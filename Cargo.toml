[workspace]
resolver = "2"
members = ["deepgemm", "deepgemm-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/idrees2516/deepgemm-rust"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
